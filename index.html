<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Jajoo — Data Scientist & ML Engineer</title>
  <meta name="description" content="Jay Jajoo — MS Data Science @ Northeastern. Building LLMs, agentic systems, and full-stack ML pipelines." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── CSS VARIABLES ─────────────────────────────────────────── */
    :root {
      --bg-deep:        #050510;
      --bg-mid:         #080820;
      --bg-surface:     rgba(255,255,255,0.04);
      --bg-surface-h:   rgba(255,255,255,0.08);
      --accent-cyan:    #00d4ff;
      --accent-purple:  #7b2fff;
      --accent-pink:    #ff2d78;
      --accent-green:   #00ff88;
      --text-primary:   #e8e8f0;
      --text-muted:     #8888aa;
      --border:         rgba(255,255,255,0.08);
      --border-h:       rgba(0,212,255,0.3);
      --glow-cyan:      rgba(0,212,255,0.15);
      --glow-purple:    rgba(123,47,255,0.15);
      --glow-pink:      rgba(255,45,120,0.15);
      --radius:         16px;
      --radius-sm:      10px;
      --transition:     0.35s cubic-bezier(0.4,0,0.2,1);
    }

    /* ─── RESET ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    /* ─── CUSTOM CURSOR ─────────────────────────────────────────── */
    #cursor-dot, #cursor-ring {
      position: fixed; top: 0; left: 0;
      border-radius: 50%; pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s;
    }
    #cursor-dot {
      width: 8px; height: 8px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }
    #cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(0,212,255,0.5);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
    }
    body:has(a:hover) #cursor-ring,
    body:has(button:hover) #cursor-ring {
      width: 52px; height: 52px;
      border-color: var(--accent-purple);
    }

    /* ─── SCROLL PROGRESS ───────────────────────────────────────── */
    #scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      z-index: 9998; width: 0%; transition: width 0.1s;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* ─── NAVIGATION ─────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 3rem;
      background: rgba(5,5,16,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    nav.scrolled { background: rgba(5,5,16,0.95); }
    .nav-logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900; font-size: 1.3rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 2px;
    }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a {
      font-size: 0.85rem; font-weight: 500; letter-spacing: 1px;
      color: var(--text-muted); text-transform: uppercase;
      position: relative; transition: color var(--transition);
      cursor: none;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width var(--transition);
    }
    .nav-links a:hover { color: var(--accent-cyan); }
    .nav-links a:hover::after { width: 100%; }
    .nav-resume-btn {
      padding: 0.45rem 1.2rem; border-radius: 50px;
      border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
      font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; cursor: none;
      transition: all var(--transition);
      background: transparent;
    }
    .nav-resume-btn:hover {
      background: var(--accent-cyan); color: var(--bg-deep);
      box-shadow: 0 0 20px var(--glow-cyan);
    }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 24px; height: 2px; background: var(--accent-cyan); transition: all 0.3s; display: block; }

    /* ─── KEYFRAMES ─────────────────────────────────────────────── */
    @keyframes rotate-border {
      to { --angle: 360deg; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33%       { transform: translateY(-20px) rotate(120deg); }
      66%       { transform: translateY(10px) rotate(240deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.4), 0 0 60px rgba(0,212,255,0.15); }
      50%       { box-shadow: 0 0 40px rgba(0,212,255,0.7), 0 0 100px rgba(123,47,255,0.3); }
    }
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes bounce-y {
      0%, 100% { transform: translateY(0) translateX(-50%); }
      50%       { transform: translateY(10px) translateX(-50%); }
    }
    @keyframes shimmer-sweep {
      from { transform: translateX(-100%) skewX(-15deg); }
      to   { transform: translateX(300%) skewX(-15deg); }
    }
    @keyframes scanline {
      0%   { top: -10%; }
      100% { top: 110%; }
    }
    @keyframes orb-drift {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(40px, -60px) scale(1.1); }
      50%  { transform: translate(-30px, 30px) scale(0.95); }
      75%  { transform: translate(60px, 20px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes timeline-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(0,212,255,0); }
    }

    /* ─── REVEAL ANIMATION ──────────────────────────────────────── */
    .reveal {
      opacity: 0; transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ─── GLASS CARD ────────────────────────────────────────────── */
    .glass {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.06);
      transition: all var(--transition);
      position: relative; overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      transform: skewX(-15deg);
      transition: left 0.7s ease;
      pointer-events: none;
    }
    .glass:hover::before { left: 150%; }
    .glass:hover {
      border-color: var(--border-h);
      box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 30px var(--glow-cyan),
                  inset 0 1px 0 rgba(255,255,255,0.1);
      transform: translateY(-4px);
    }

    /* ─── SECTION LAYOUT ────────────────────────────────────────── */
    section {
      padding: 6rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; letter-spacing: 3px;
      color: var(--accent-cyan); text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem; font-weight: 700;
      margin-bottom: 0.5rem; line-height: 1.2;
    }
    .section-title span {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .section-divider {
      width: 60px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      margin-bottom: 3rem;
      box-shadow: 0 0 12px var(--glow-cyan);
    }

    /* ─── HERO SECTION ──────────────────────────────────────────── */
    #hero {
      position: relative; height: 100vh; min-height: 700px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 0;
      max-width: 100%;
    }
    #particle-canvas {
      position: absolute; inset: 0; z-index: 0;
    }
    .hero-orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.18; pointer-events: none;
      animation: orb-drift 18s ease-in-out infinite;
    }
    .hero-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--accent-purple), transparent);
      top: -100px; left: -100px; animation-delay: 0s;
    }
    .hero-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--accent-cyan), transparent);
      bottom: -100px; right: -100px; animation-delay: -9s;
    }
    .hero-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, var(--accent-pink), transparent);
      top: 50%; right: 10%; animation-delay: -4s;
    }
    .scanline {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent);
      animation: scanline 8s linear infinite; pointer-events: none; z-index: 1;
    }
    .hero-content {
      position: relative; z-index: 2; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }

    /* Avatar */
    .avatar-wrapper {
      position: relative; width: 160px; height: 160px;
      margin-bottom: 0.5rem;
    }
    .avatar-ring {
      position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        var(--accent-cyan),
        var(--accent-purple),
        var(--accent-pink),
        var(--accent-cyan)
      );
      animation: spin-ring 3s linear infinite;
      padding: 3px;
    }
    .avatar-ring-inner {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--bg-deep);
    }
    .avatar-core {
      position: absolute; inset: 6px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(123,47,255,0.2));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif; font-size: 2.8rem; font-weight: 900;
      color: var(--accent-cyan); letter-spacing: -2px;
      animation: pulse-glow 3s ease-in-out infinite;
      border: 1px solid rgba(0,212,255,0.3);
      text-shadow: 0 0 20px var(--accent-cyan), 0 0 40px var(--accent-purple);
    }

    /* Hero text */
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
      color: var(--accent-cyan); letter-spacing: 4px; text-transform: uppercase;
    }
    .hero-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900;
      line-height: 1.1; letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-role-wrapper {
      height: 2rem; display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; color: var(--text-muted); font-weight: 400;
    }
    #typing-text { color: var(--accent-cyan); font-weight: 500; }
    #typing-cursor {
      display: inline-block; width: 2px; height: 1.1em;
      background: var(--accent-cyan); margin-left: 3px; vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    .hero-tagline {
      font-size: 1rem; color: var(--text-muted); max-width: 500px;
      line-height: 1.8;
    }

    /* Hero CTA */
    .hero-cta { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      padding: 0.75rem 2rem; border-radius: 50px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.5px; cursor: none;
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
      transition: all var(--transition); border: none;
    }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 30px rgba(0,212,255,0.5);
    }
    .btn-ghost {
      padding: 0.75rem 2rem; border-radius: 50px;
      border: 1px solid var(--border-h); color: var(--accent-cyan);
      font-weight: 600; font-size: 0.9rem; cursor: none;
      transition: all var(--transition); background: transparent;
    }
    .btn-ghost:hover {
      background: rgba(0,212,255,0.08); transform: translateY(-3px);
      box-shadow: 0 0 20px var(--glow-cyan);
    }

    /* Social icons */
    .hero-socials { display: flex; gap: 1.2rem; margin-top: 0.5rem; }
    .social-icon {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: none;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
    }
    .social-icon:hover {
      border-color: var(--accent-cyan); color: var(--accent-cyan);
      box-shadow: 0 0 15px var(--glow-cyan); transform: translateY(-4px);
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5rem; z-index: 2; cursor: none;
      animation: bounce-y 2s ease-in-out infinite;
    }
    .scroll-indicator span {
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
      color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
    }
    .scroll-arrow {
      width: 20px; height: 20px; border-right: 2px solid var(--accent-cyan);
      border-bottom: 2px solid var(--accent-cyan); transform: rotate(45deg);
      opacity: 0.6;
    }
  </style>
</head>
